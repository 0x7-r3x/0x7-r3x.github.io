<!DOCTYPE html>
<html>
  <head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QJ9TR5T9S2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-QJ9TR5T9S2');
    </script>

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rex | Terminal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="img/fav-icon.png" />

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: monospace;
        background-color: black;
        color: white;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #terminal {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        margin-bottom: 60px; /* enough space for command bar */
      }

      #command {
        position: fixed;
        bottom: 0;
        width: 100%;
        background-color: #000;
        padding: 10px;
        z-index: 100;
      }

      #texter {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: white;
        font-family: monospace;
        font-size: 16px;
        resize: none;
        height: 40px;
      }

      #liner {
        display: flex;
        align-items: center;
        font-size: 16px;
        white-space: nowrap;
        overflow-x: auto;
      }

      @media screen and (max-width: 600px) {
        body {
          font-size: 14px;
        }

        #terminal {
          margin-bottom: 100px;
          padding: 10px;
        }

        #texter {
          font-size: 14px;
          height: 36px;
        }

        #liner {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="terminal">
      <a id="before"></a>
    </div>

    <div id="command" onclick="document.getElementById('texter').focus();">
      <textarea
        id="texter"
        onkeyup="typeIt(this, event)"
        onkeydown="typeIt(this, event); moveIt(this.value.length, event)"
        onkeypress="typeIt(this, event);"
        autofocus
      ></textarea>
      <div id="liner">
        <span id="typer"></span><b class="cursor" id="cursor">█</b>
      </div>
    </div>

    <script src="disableMouse.js"></script>
    <script src="js/caret.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
