<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rex | Terminal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="img/fav-icon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: monospace;
      background: black;
      color: #00ff00;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url("img/terminal.png");
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: -1;
    }

    #terminal {
      padding: 20px;
    }

    #command {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #texter {
      width: 100%;
      background: transparent;
      border: none;
      color: #00ff00;
      font-family: monospace;
      font-size: 16px;
      outline: none;
      resize: none;
      height: 24px;
    }

    #liner {
      display: flex;
      align-items: center;
      font-size: 16px;
    }

    .cursor {
      display: inline-block;
      margin-left: 2px;
    }

    @media screen and (max-width: 600px) {
      #texter {
        font-size: 14px;
        height: 22px;
      }
      #liner {
        font-size: 14px;
      }
    }
  </style>
</head>
<body onclick="document.getElementById('texter').focus();">

  <div id="terminal">
    <a id="before"></a>

    <div id="command">
      <textarea
        id="texter"
        onkeyup="typeIt(this, event)"
        onkeydown="typeIt(this, event); moveIt(this.value.length, event)"
        onkeypress="typeIt(this, event);"
        autofocus
      ></textarea>
      <div id="liner">
        <span id="typer"></span><b class="cursor" id="cursor">█</b>
      </div>
    </div>
  </div>

  <script src="disableMouse.js"></script>
  <script src="js/caret.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
